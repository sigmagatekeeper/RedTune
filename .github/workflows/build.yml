name: Build RedTune VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 | ForEach-Object { Copy-Item -Recurse $_.FullName -Destination out }

      - uses: actions/upload-artifact@v4
        with:
          name: RedTune-VST3
          path: out/

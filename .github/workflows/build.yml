name: REDTUNE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item -Recurse -Path "build/DemonVoice_artefacts/Release/VST3/DemonVoice.vst3" -Destination "out/DemonVoice.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: DemonVoice-VST3
          path: out/
